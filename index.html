const STORE='shanghai-trip-2026-done-v1', STORE_DAY='shanghai-trip-2026-active-day-v1';
function safeLoad(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return {}}} let done=safeLoad();
for(const d of days)for(const x of d.items)if(x.seedDone&&done[x.id]===undefined)done[x.id]=true;
function safeSave(){try{localStorage.setItem(STORE,JSON.stringify(done))}catch(e){toast('완료 상태를 저장할 수 없어요')}}
function shanghaiDate(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return ''}}

function savedDay(){try{const x=JSON.parse(localStorage.getItem(STORE_DAY)||'null');return x&&x.on===shanghaiDate()&&Number.isInteger(x.index)&&days[x.index]?x.index:null}catch(e){return null}}
function saveDay(){try{localStorage.setItem(STORE_DAY,JSON.stringify({index:active,on:shanghaiDate()}))}catch(e){}}
let active=savedDay()??todayIndex;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mapUrl(x){const q=x.address||x.zh||x.ko;return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`}
function todayCard(){const d=days[active], next=d.items.find(x=>!done[x.id]);document.getElementById('todayBox').innerHTML=`<div class="today-label">${d.date===shanghaiDate()?'TODAY · 오늘':'SELECTED DAY'}</div><div class="today-title">${esc(next?'다음: '+next.ko:d.title)}</div><div class="today-sub">${esc(next?next.time+' · '+d.summary:'오늘 일정 완료 · '+d.summary)}</div>`}
function renderTabs(){document.getElementById('tabs').innerHTML=days.map((d,i)=>`<button class="tab ${i===active?'active':''}" data-i="${i}" aria-current="${i===active?'date':'false'}">${d.label}<span>${d.weekday}요일</span></button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=+b.dataset.i;saveDay();render()})}
function itemHtml(x,nextId){return `<article class="item ${done[x.id]?'done':''} ${x.id===nextId?'now':''}" id="${x.id}"><div><span class="time">${esc(x.time)}</span><span class="kind">${esc(x.kind)}</span></div><div class="place">${esc(x.ko)}</div><div class="zh" lang="zh-CN">${esc(x.zh)}</div>${x.address?`<div class="address" lang="zh-CN">${esc(x.address)}</div>`:''}<div class="detail">${esc(x.detail)}</div>${x.menu?`<div class="menu"><strong>메뉴·주문</strong><br>${esc(x.menu)}</div>`:''}<div class="actions"><button class="action" data-copy="${esc(x.address||x.zh)}">주소 복사</button><a class="action map" href="${mapUrl(x)}" target="_blank" rel="noopener">Google 지도</a><button class="check" data-check="${x.id}" aria-label="완료 전환">${done[x.id]?'✓ 완료됨':'○ 완료 표시'}</button></div></article>`}
function guideHtml(){return `<h3>🛵 메이퇀 배달 주문 가이드</h3><p>객실·전화번호는 이 페이지에 저장하지 말고 주문 앱에서만 입력하세요.</p><div class="step"><b>1.</b> 호텔 중국어명을 배송지로 검색 → 상세 주소는 앱 지도에서 확인</div><div class="step"><b>2.</b> 배달은 호텔 1층 로비 수령으로 요청<div class="phrase" lang="zh-CN">请送到酒店一楼大堂，我会下楼取。<button data-copy="请送到酒店一楼大堂，我会下楼取。">문구 복사</button></div></div><div class="step"><b>3.</b> 앱 메시지로 연락 요청<div class="phrase" lang="zh-CN">到了请在美团App里发消息，不要打电话。<button data-copy="到了请在美团App里发消息，不要打电话。">문구 복사</button></div></div><div class="step"><b>4.</b> 주문 요청 문구<div class="phrase" lang="zh-CN">少辣，不要香菜，餐具两份，谢谢。<button data-copy="少辣，不要香菜，餐具两份，谢谢。">덜 맵게·고수 제외·식기 2개 복사</button></div></div>`}
function render(){const d=days[active],complete=d.items.filter(x=>done[x.id]).length,next=d.items.find(x=>!done[x.id]);renderTabs();todayCard();document.getElementById('dayView').innerHTML=`<div class="day-head"><div><h2>${d.label} ${d.title}</h2><p>${esc(d.summary)}</p></div><div class="progress">${complete}/${d.items.length} 완료</div></div><div class="bar"><i style="width:${complete/d.items.length*100}%"></i></div><div class="storage-note">완료 체크와 선택한 날짜는 이 기기·브라우저에 저장됩니다. 텔레그램 내장 브라우저와 Safari는 별도 저장입니다.</div><div class="timeline">${d.items.map(x=>itemHtml(x,next&&next.id)).join('')}</div>`;document.getElementById('deliveryGuide').innerHTML=guideHtml();wire()}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove()}
async function copyText(text,button){try{await navigator.clipboard.writeText(text)}catch(e){fallbackCopy(text)}const before=button.textContent;button.textContent='복사됨 ✓';toast('복사했습니다');setTimeout(()=>{if(button.isConnected)button.textContent=before},1600)}
function wire(){document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy,b));document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{done[b.dataset.check]=!done[b.dataset.check];safeSave();render()})}
let toastTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1600)}
render();
</script>
</body>
</html>
